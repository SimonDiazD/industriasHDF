version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Si tu backend es Python, comenta el bloque npm de /backend de arriba
  # y descomenta este:
  # - package-ecosystem: "pip"
  #   directory: "/backend"
  #   schedule:
  #     interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
