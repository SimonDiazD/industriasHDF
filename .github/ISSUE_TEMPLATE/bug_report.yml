name: "🐛 Bug Report"
description: Reporta un error encontrado durante desarrollo o pruebas.
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del error
      description: ¿Qué está pasando?
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a...
        2. Hacer clic en...
        3. Ver el error...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: dropdown
    id: capas
    attributes:
      label: Capas involucradas
      multiple: true
      options:
        - Frontend
        - Backend
        - Database
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Crítica (bloquea uso del sistema)
        - Alta
        - Media
        - Baja
    validations:
      required: true
